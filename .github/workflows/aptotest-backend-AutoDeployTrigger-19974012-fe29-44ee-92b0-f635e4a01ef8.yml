name: Trigger auto deployment for aptotest-backend

on:
  push:
    branches:
      [ master, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APTOTESTBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APTOTESTBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APTOTESTBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.APTOTESTBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APTOTESTBACKEND_REGISTRY_PASSWORD }}
          containerAppName: aptotest-backend
          resourceGroup: tfm
          imageToBuild: ${{ secrets.ACR_LOGIN_SERVER }}/aptotest-backend:${{ github.sha }}