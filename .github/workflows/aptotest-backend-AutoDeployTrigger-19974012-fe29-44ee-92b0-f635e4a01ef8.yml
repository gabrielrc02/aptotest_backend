name: Trigger auto deployment for aptotest-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/aptotest-backend-AutoDeployTrigger-19974012-fe29-44ee-92b0-f635e4a01ef8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APTOTESTBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APTOTESTBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APTOTESTBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: aptotestregistry.azurecr.io
          registryUsername: ${{ secrets.APTOTESTBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APTOTESTBACKEND_REGISTRY_PASSWORD }}
          containerAppName: aptotest-backend
          resourceGroup: tfm
          imageToBuild: aptotestregistry.azurecr.io/aptotest-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


